<!DOCTYPE html>
<html lang="en">
<head>

<title>Málaga Towers · Choose your floor</title>

<style>
:root{--bronze:#d8b47a;--txt:#f1f3f5;--mute:#a3acb6;--line:rgba(255,255,255,.10);--panel:rgba(13,17,23,.62);--av:#7fd8a6;--rs:#f2bd5c;--sd:#5f6873}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0c1015;color:var(--txt);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#c,#still,#clip{position:fixed;inset:0;width:100%;height:100%;display:block}
#c{outline:none;touch-action:none}
#still,#clip{object-fit:cover;pointer-events:none;opacity:0;transition:opacity .5s}
#still.on,#clip.on{opacity:1}
#ov{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
#ov polygon{fill:rgba(255,255,255,.14);stroke:rgba(255,255,255,.85);stroke-width:1.5;stroke-linejoin:round}
#ov polygon.sel{fill:rgba(255,199,110,.28);stroke:#ffc76e;stroke-width:2}
#ov polygon.unit{fill:rgba(255,224,166,.45);stroke:#ffe0a6}
.glass{background:var(--panel);backdrop-filter:blur(18px) saturate(1.25);-webkit-backdrop-filter:blur(18px) saturate(1.25);border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.28)}
.brand{position:fixed;top:22px;left:24px;z-index:5;pointer-events:none}
.brand .logo{font-family:Montserrat,sans-serif;font-weight:800;letter-spacing:.32em;font-size:15px;text-shadow:0 2px 14px rgba(0,0,0,.45)}
.brand .logo b{color:var(--bronze)}
.brand .tag{margin-top:6px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.8);text-shadow:0 1px 8px rgba(0,0,0,.5)}
#filters{position:fixed;top:18px;right:18px;z-index:5;display:flex;align-items:center;gap:6px;padding:6px}
#filters .lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);padding:0 8px 0 10px}
.chip{padding:8px 12px;border-radius:12px;font-size:13px;font-weight:500;color:var(--mute);transition:.2s}
.chip:hover{color:var(--txt);background:rgba(255,255,255,.06)}
.chip.on{background:var(--bronze);color:#1a140c}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
#matchInfo{font-size:12px;color:var(--bronze);padding:0 10px;white-space:nowrap}
#elev{position:fixed;left:18px;top:50%;transform:translateY(-46%);z-index:5;width:132px;padding:10px;display:flex;flex-direction:column;max-height:calc(100vh - 200px)}
.tabs{display:flex;gap:4px;margin-bottom:8px}
.tab{flex:1;padding:8px 0;border-radius:10px;font-family:Montserrat,sans-serif;font-weight:700;font-size:13px;color:var(--mute);transition:.2s}
.tab:hover{color:var(--txt);background:rgba(255,255,255,.06)}
.tab.on{background:rgba(216,180,122,.16);color:var(--bronze)}
.tsum{font-size:11px;color:var(--mute);text-align:center;margin-bottom:8px}
.tsum b{color:var(--av);font-weight:600}
#floors{overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column;gap:1px}
#floors::-webkit-scrollbar{display:none}
.fl{display:flex;align-items:center;gap:8px;padding:3px 8px;border-radius:8px;transition:background .15s,opacity .2s;text-align:left}
.fl span{width:22px;font-size:11px;font-variant-numeric:tabular-nums;color:var(--mute)}
.fl i{display:flex;gap:3px}
.fl i em{width:12px;height:6px;border-radius:3px;display:block}
.fl:hover,.fl.hv{background:rgba(255,255,255,.08)}
.fl.on{background:rgba(216,180,122,.22)}
.fl.on span{color:var(--bronze);font-weight:600}
.fl.dim{opacity:.28}
.st-available{background:var(--av)}.st-reserved{background:var(--rs)}.st-sold{background:var(--sd)}
.tr{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--bronze);padding:5px 8px;opacity:.85}
#panel{position:fixed;right:18px;top:84px;bottom:96px;width:384px;z-index:6;display:flex;flex-direction:column;overflow:hidden;transform:translateX(calc(100% + 30px));transition:transform .45s cubic-bezier(.2,.8,.2,1)}
#panel.open{transform:none}
.ph{padding:18px 18px 12px;display:flex;align-items:flex-start;gap:10px;border-bottom:1px solid var(--line)}
.ph .t{flex:1}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--bronze)}
.ph h2{font-family:Montserrat,sans-serif;font-weight:700;font-size:28px;margin:4px 0 2px}
.meta{font-size:12.5px;color:var(--mute)}

.ib{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--mute);border:1px solid var(--line);transition:.2s;font-size:15px}

.pb{overflow-y:auto;padding:14px 18px 18px;flex:1;scrollbar-width:thin}
.plan{width:100%;display:block;margin-bottom:10px}
.plan .pl{fill:rgba(255,255,255,.07);stroke:rgba(255,255,255,.25);stroke-width:.08}

.plan .u.reserved{fill:var(--rs);fill-opacity:.28}
.plan .u.sold{fill:#8a939d;fill-opacity:.18}

.legend{display:flex;gap:14px;font-size:11.5px;color:var(--mute);margin-bottom:12px}
.legend span{display:flex;align-items:center;gap:6px}

.unit .p small{display:block;font-size:11px;font-weight:500;margin-top:2px}
.c-available{color:var(--av)}.c-reserved{color:var(--rs)}.c-sold{color:var(--mute)}

.price{font-family:Montserrat,sans-serif;font-size:22px;font-weight:700;margin-bottom:12px}

.tod{font-size:12px;padding:8px 10px}

#labels{position:fixed;inset:0;pointer-events:none;z-index:3}
.tl{position:absolute;left:0;top:0;pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;transition:opacity .3s}
.tl b{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:Montserrat,sans-serif;font-weight:700;font-size:14px;background:rgba(13,17,23,.55);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.4);transition:.2s}

#toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,20px);z-index:9;padding:12px 16px;border-radius:14px;font-size:13px;opacity:0;transition:.35s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
#loader{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#0c1015;transition:opacity .9s}
#loader div{font-family:Montserrat,sans-serif;font-weight:800;letter-spacing:.32em;font-size:14px;color:var(--bronze);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
#loader.done{opacity:0;pointer-events:none}
#dev{position:fixed;left:166px;bottom:80px;z-index:7;padding:12px;display:none;flex-direction:column;gap:6px;width:250px;font-size:12px}
#dev.on{display:flex}
#dev b{font-family:Montserrat,sans-serif;letter-spacing:.12em;font-size:11px;color:var(--bronze)}
#dev button{padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.08);text-align:left}
#dev button:hover{background:rgba(255,255,255,.15)}
#devlog{color:var(--mute);min-height:16px}
body.shoot #filters,body.shoot #elev,body.shoot #panel,body.shoot #views,body.shoot #hint,body.shoot #labels,body.shoot .brand,body.shoot #tip{visibility:hidden}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Sky } from 'three/addons/objects/Sky.js';

/* =====================================================================
   CONFIG
   Geometry follows the built Málaga Towers (Estudio Lamela, 2025):
   3 towers · 21 residential floors each · ~26×26 m plots · white cantilevered
   slab "plates" that shift floor by floor · frameless glass balustrades ·
   dark glass skin · grey louvre screens · rooftop infinity pool + timber plant room.
   ===================================================================== */
const CONFIG = {
  floors: 21, floorH: 3.3, groundH: 5.2, slabT: 1.1,
  W: 32, D: 24,                 // glass skin footprint (m); plates cantilever up to 4 m beyond (sea face ≈ 40 m, see refs/video/v3_4k_front_from_sea_*)
  coreW: 7, coreD: 9,
  // Straight row parallel to the coast, 72 m apart (measured on v3_4k_front_from_sea_golden_hour).
  // podium: low 2-storey white wing (local x0..x1, z0..z1) with a communal pool on its roof; A and C reach toward B.
  towers: [
    { id:'A', x:-72, z:-55, seed:11, podium:[16,38,-16,15] },
    { id:'B', x:0,   z:-55, seed:23, podium:null },
    { id:'C', x:72,  z:-55, seed:37, podium:[-38,-16,-16,15] },
  ],
  currency:'€',
  seed: 20261115,
  // Drop your Higgsfield renders in here. Missing entries fall back to the live 3D.
  media: {
    stills: { front:null, side:null, back:null, rooftop:null, aerial:null },      // e.g. 'media/front.jpg'
    clips:  { /* 'front>side':'media/front-side.mp4', 'side>front':'media/side-front.mp4', … */ },
  },
};
const ORDER = ['front','side','back','rooftop','aerial'];
// Each camera is matched to a real reference photo (fov 34°, 16:9), solved from measured pixel positions:
const VIEWS = {
  front:   { pos:[-24.1, 7.4, 241],   target:[-5.1, 12.6, -55] },  // refs/video/v3_4k_front_from_sea_golden_hour (4 px rms)
  side:    { pos:[-265, 2.4, 68],     target:[-110.5, 23.5, 26.6] },  // refs/full/19_photo_promenade: west plaza looking east
  back:    { pos:[-20, 81.5, -314.6], target:[-20, 39, -55] },     // refs/video/v1_render_three_towers_from_city
  rooftop: { pos:[80, 77.65, -63.7],  target:[171.35, 67.15, -23] },// refs/video/v3_4k_rooftop_pool_coast (tower C roof, looking ESE)
  aerial:  { pos:[-89.5, 71, 224.6],  target:[-10.9, 7.7, -55] },   // refs/video/v1_drone_oblique_promenade
};
const DEV = new URLSearchParams(location.search).has('dev');

/* ---------------- helpers ---------------- */
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R = rng(CONFIG.seed);
const FH=CONFIG.floorH, T=CONFIG.slabT, HW=CONFIG.W/2, HD=CONFIG.D/2;
const ROOF_Y = CONFIG.groundH + CONFIG.floors*FH;

/* ---------------- plates: the signature shifting slabs ---------------- */
const DEPTHS=[1.1,2.0,3.0,4.0];
const BAND=2.6;          // floors 1–2: uniform white overhang / band (refs/user/sv_01_tower_base_street.png)
function makePlates(rand, level){
  const pick=()=>DEPTHS[(rand()*DEPTHS.length)|0];
  const seg={};
  for(const k of ['S','N','E','W']){
    const L = (k==='S'||k==='N') ? CONFIG.W : CONFIG.D;
    const split = L*(0.36+rand()*0.28);
    let d1=pick(), d2=pick();
    if(Math.abs(d1-d2)<0.9) d2 = d1>2.4 ? 1.1 : 4.0;
    if(level%2) [d1,d2]=[d2,d1];
    if(level<=2) d1=d2=BAND;                          // base: continuous band, the stagger starts at floor 3
    seg[k]=[{a:-L/2,b:-L/2+split,d:d1},{a:-L/2+split,b:L/2,d:d2}];
  }
  const boxes=[], rails=[];
  const box=(x,z,sx,sz)=>boxes.push({x,z,sx,sz});
  const rail=level===1 ? ()=>{} : (x,z,sx,sz)=>rails.push({x,z,sx,sz});   // floor 1 sits behind the posts, no balustrade
  // faces
  for(const s of seg.S){ box((s.a+s.b)/2, HD+s.d/2, s.b-s.a, s.d); rail((s.a+s.b)/2, HD+s.d, s.b-s.a, .04); }
  for(const s of seg.N){ box((s.a+s.b)/2,-HD-s.d/2, s.b-s.a, s.d); rail((s.a+s.b)/2,-HD-s.d, s.b-s.a, .04); }
  for(const s of seg.E){ box( HW+s.d/2,(s.a+s.b)/2, s.d, s.b-s.a); rail( HW+s.d,(s.a+s.b)/2, .04, s.b-s.a); }
  for(const s of seg.W){ box(-HW-s.d/2,(s.a+s.b)/2, s.d, s.b-s.a); rail(-HW-s.d,(s.a+s.b)/2, .04, s.b-s.a); }
  // steps between the two segments of a face
  const step=(k)=>{ const [p,q]=seg[k], lo=Math.min(p.d,q.d), hi=Math.max(p.d,q.d), m=p.b, len=hi-lo; if(len<0.01) return;
    if(k==='S') rail(m, HD+lo+len/2, .04, len); if(k==='N') rail(m,-HD-lo-len/2,.04,len);
    if(k==='E') rail(HW+lo+len/2, m, len, .04); if(k==='W') rail(-HW-lo-len/2, m, len, .04); };
  ['S','N','E','W'].forEach(step);
  // corners (plates wrap continuously round the corners)
  const corner=(sx,sz,dX,dZ)=>{ const cx=sx*(HW+dX/2), cz=sz*(HD+dZ/2); box(cx,cz,dX,dZ);
    rail(cx, sz*(HD+dZ), dX, .04); rail(sx*(HW+dX), cz, .04, dZ); };
  corner( 1, 1, seg.E[1].d, seg.S[1].d);
  corner(-1, 1, seg.W[1].d, seg.S[0].d);
  corner( 1,-1, seg.E[0].d, seg.N[1].d);
  corner(-1,-1, seg.W[0].d, seg.N[0].d);
  return {boxes, rails};
}

/* ---------------- sample sales data (swap for the real feed) ---------------- */
function makeUnits(f){
  const n=f.num, t=f.tower;
  const NW=[-HW,0,-HD,0], NE=[0,HW,-HD,0], SW=[-HW,0,0,HD], SE=[0,HW,0,HD], Wd=[-HW,0,-HD,HD], Ed=[0,HW,-HD,HD];
  const status=(bias=0)=>{ const r=R(); return r<0.7-bias?'sold':r<0.8-bias?'reserved':'available'; };
  const ppm=(sea)=>9300+n*110+(sea?900:0);
  if(n>=20){
    if(n===21) return t.floors[19].units;                 // duplex penthouse spans 20–21
    const area=384, price=Math.round(area*11500/5000)*5000;
    return [{ idx:0, code:`${t.id}-PH`, rects:[Wd,Ed], area, beds:4, baths:4, terrace:76, orient:'Panoramic · duplex 20–21', price, status:'available', floor:f }];
  }
  if(n>=17){
    return [[Wd,'West'],[Ed,'East']].map(([r,side],i)=>{ const area=219;
      return { idx:i, code:`${t.id}-${String(n).padStart(2,'0')}${'AB'[i]}`, rects:[r], area, beds:4, baths:3, terrace:44,
        orient:`Sea + city · ${side}`, price:Math.round(area*ppm(true)/5000)*5000, status:status(), floor:f }; });
  }
  return [[SW,'Sea · South-west',true],[SE,'Sea · South-east',true],[NW,'City · North-west',false],[NE,'City · North-east',false]].map(([r,o,sea],i)=>{
    const area = sea?132:104, beds = sea?3:(n<=4?1:2);
    return { idx:i, code:`${t.id}-${String(n).padStart(2,'0')}${'ABCD'[i]}`, rects:[r], area, beds, baths:sea?2:(beds>1?2:1), terrace:sea?28:14,

/* ---------------- camera moves (same curve for live flights and recorded clips) ---------------- */
let flight=null;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function makeFlight(fromPos,fromTarget,toPos,toTarget,dur){
  const st=new THREE.Vector3(...fromTarget), et=new THREE.Vector3(...toTarget);
  const so=new THREE.Spherical().setFromVector3(new THREE.Vector3(...fromPos).sub(st)), eo=new THREE.Spherical().setFromVector3(new THREE.Vector3(...toPos).sub(et));
  let dT=eo.theta-so.theta; dT=((dT+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;
  const duration=dur??THREE.MathUtils.clamp(1.3+Math.abs(dT)*0.6+Math.abs(Math.log(eo.radius/so.radius))*0.6+st.distanceTo(et)/260,1.3,3.6);
  return {t:0,duration,st,et,so,eo,dT};
}
function poseAt(f,k){ const e=ease(k), tgt=f.st.clone().lerp(f.et,e);
  const r=Math.exp(THREE.MathUtils.lerp(Math.log(f.so.radius),Math.log(f.eo.radius),e));
  const phi=Math.max(0.05,THREE.MathUtils.lerp(f.so.phi,f.eo.phi,e)-Math.sin(Math.PI*e)*0.1);
  const pos=new THREE.Vector3().setFromSpherical(new THREE.Spherical(r,phi,f.so.theta+f.dT*e)).add(tgt); return {pos,tgt}; }
function flyTo(pos,target,{clouds=false,dur,onDone}={}){
  flight=makeFlight(camera.position.toArray(),controls.target.toArray(),pos,target,dur); flight.onDone=onDone;
  controls._sphericalDelta?.set(0,0,0); controls._panOffset?.set(0,0,0); if('_scale' in controls) controls._scale=1;   // drop leftover orbit inertia
  controls.enabled=false; cloudTarget=clouds?1:0;
}
function stepFlight(dt){
  if(!flight) return; const f=flight; f.t=Math.min(1,f.t+dt/f.duration);
  const {pos,tgt}=poseAt(f,f.t); camera.position.copy(pos); camera.lookAt(tgt);
  if(f.t>=1){ controls.target.copy(f.et); controls.enabled=true; flight=null; f.onDone?.(); }
}
function setPose(v){ camera.position.set(...v.pos); controls.target.set(...v.target); camera.lookAt(controls.target); }
function floorWorld(f){ return new THREE.Vector3(0,f.y+FH/2,0).applyMatrix4(f.tower.group.matrixWorld); }
function flyToFloor(f){
  const w=floorWorld(f), behind=camera.position.z<w.z-20;
  const dir=new THREE.Vector3(f.tower.id==='A'?-0.5:f.tower.id==='C'?0.5:0.06,0,behind?-1:1).normalize();
  const p=w.clone().addScaledVector(dir,128); p.y=w.y+16;
  markView(null); flyTo(p.toArray(),w.toArray());
}
function flyToTower(t){
  const w=new THREE.Vector3(0,ROOF_Y*0.55,0).applyMatrix4(t.group.matrixWorld);
  const dir=new THREE.Vector3(t.id==='A'?-0.45:t.id==='C'?0.45:0.05,0,camera.position.z<w.z-20?-1:1).normalize();
  const p=w.clone().addScaledVector(dir,215); p.y=w.y+22; markView(null); flyTo(p.toArray(),w.toArray());
}
function markView(v){ state.view=v; document.querySelectorAll('.vw').forEach(b=>b.classList.toggle('on',b.dataset.v===v)); }

/* ---------------- photo mode: Higgsfield stills + clips ---------------- */
const stillEl=document.getElementById('still'), clipEl=document.getElementById('clip');
const hasStill=v=>!!CONFIG.media.stills[v];
const clipKey=(a,b)=>`${a}>${b}`;
function pathBetween(a,b){ const n=ORDER.length,i=ORDER.indexOf(a),j=ORDER.indexOf(b); const fwd=(j-i+n)%n, back=(i-j+n)%n, steps=[];
  if(fwd<=back) for(let k=0;k<fwd;k++) steps.push([ORDER[(i+k)%n],ORDER[(i+k+1)%n]]);
  else for(let k=0;k<back;k++) steps.push([ORDER[(i-k+n)%n],ORDER[(i-k-1+n)%n]]);
  return steps; }
function enterPhoto(v){ if(!hasStill(v)) return; stillEl.src=CONFIG.media.stills[v]; stillEl.classList.add('on'); state.photo=true; canvas.style.opacity='0'; }
function exitPhoto(){ if(!state.photo) return; state.photo=false; stillEl.classList.remove('on'); canvas.style.opacity='1'; drawOverlay(); }
stillEl.onerror=()=>{ const v=state.view; if(v) CONFIG.media.stills[v]=null; exitPhoto(); };
async function playClips(steps){
  clipEl.classList.add('on');
  for(const [a,b] of steps){
    clipEl.src=CONFIG.media.clips[clipKey(a,b)];
    try{ await clipEl.play(); }catch(e){ break; }
    await new Promise(res=>clipEl.onended=res);
    stillEl.src=CONFIG.media.stills[b]||'';
  }
  clipEl.classList.remove('on');
}
function goView(name){
  if(!VIEWS[name]) return;
  const from=state.view, v=VIEWS[name];
  markView(name); hoverBox.visible=false;
  const steps = from ? pathBetween(from,name) : [];
  const canPlay = state.photo && steps.length && steps.every(([a,b])=>CONFIG.media.clips[clipKey(a,b)]) && hasStill(name);
  if(canPlay){ stillEl.classList.add('on'); playClips(steps).then(()=>{ setPose(v); cloudTarget=cloudK=v.clouds?1:0; enterPhoto(name); }); return; }
  if(state.photo){ stillEl.classList.remove('on'); state.photo=false; canvas.style.opacity='1'; }
  flyTo(v.pos,v.target,{clouds:!!v.clouds,onDone:()=>{ if(hasStill(name) && state.view===name) enterPhoto(name); }});
}

/* ---------------- 2D overlay polygons (photo mode) ---------------- */
const ov=document.getElementById('ov');
function hull(pts){ pts.sort((a,b)=>a[0]-b[0]||a[1]-b[1]); const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
  const lo=[],up=[]; for(const p of pts){ while(lo.length>1&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0) lo.pop(); lo.push(p); }
  for(const p of [...pts].reverse()){ while(up.length>1&&cr(up[up.length-2],up[up.length-1],p)<=0) up.pop(); up.push(p); }
  return lo.slice(0,-1).concat(up.slice(0,-1)); }
const _v=new THREE.Vector3();
function projRects(f,rects,withPlates){
  const pts=[], y0=f.y, y1=f.y+FH;
  const push=(x,z)=>{ for(const y of [y0,y1]){ _v.set(x,y,z).applyMatrix4(f.tower.group.matrixWorld).project(camera); pts.push([(_v.x*.5+.5)*innerWidth,(-_v.y*.5+.5)*innerHeight]); } };
  rects.forEach(([x0,x1,z0,z1])=>{ push(x0,z0);push(x1,z0);push(x0,z1);push(x1,z1); });
  if(withPlates) f.plates.boxes.forEach(b=>{ push(b.x-b.sx/2,b.z-b.sz/2);push(b.x+b.sx/2,b.z-b.sz/2);push(b.x-b.sx/2,b.z+b.sz/2);push(b.x+b.sx/2,b.z+b.sz/2); });
  return hull(pts).map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ');
}
const FULL=[[-HW,HW,-HD,HD]];
function drawOverlay(){
  if(!state.photo){ ov.innerHTML=''; return; }
  let h='';
  if(state.sel) h+=`<polygon class="sel" points="${projRects(state.sel,FULL,true)}"/>`;
  if(state.unit) h+=`<polygon class="unit" points="${projRects(state.sel,state.unit.rects,false)}"/>`;
  if(state.hover && state.hover!==state.sel) h+=`<polygon points="${projRects(state.hover,FULL,true)}"/>`;
  ov.innerHTML=h;
}

/* ---------------- UI ---------------- */
const $=s=>document.querySelector(s);
const money=p=>p>=1e6?`${CONFIG.currency}${(p/1e6).toFixed(2)}M`:`${CONFIG.currency}${Math.round(p/1e3)}k`;
const STATUS={available:'Available',reserved:'Reserved',sold:'Sold'};
const avail=f=>uniqUnits(f).filter(u=>u.status==='available').length;
function renderTabs(){
  $('#tabs').innerHTML=TOWERS.map(t=>`<button class="tab ${t===state.tower?'on':''}" data-t="${t.id}">${t.id}</button>`).join('');
  const t=state.tower, us=[...new Set(t.floors.flatMap(f=>f.units))], a=us.filter(u=>u.status==='available').length;
  $('#tsum').innerHTML=`Tower ${t.id} · <b>${a}</b>/${us.length} free`;
  document.querySelectorAll('.tl').forEach(el=>el.classList.toggle('on',el.dataset.t===t.id));
}
function renderFloors(){
  const t=state.tower,on=filterOn(); let h=`<div class="tr">Rooftop · pool</div>`;
  [...t.floors].reverse().forEach(f=>{ const m=on&&floorMatch(f);
    h+=`<button class="fl ${state.sel===f?'on':''} ${on&&!m?'dim':''} ${state.hover===f?'hv':''}" data-f="${f.num}"><span>${f.num}</span><i>${uniqUnits(f).map(u=>`<em class="st-${u.status}"></em>`).join('')}</i></button>`; });
  h+=`<div class="tr">Lobby · gardens</div>`; $('#floors').innerHTML=h;
  $('#floors .fl.on')?.scrollIntoView({block:'nearest'});
}
function planSVG(f){
  const pad=4.2;
  let s=`<svg class="plan" viewBox="${-HW-pad} ${-HD-pad} ${CONFIG.W+pad*2} ${CONFIG.D+pad*2+1.6}">`;
  f.plates.boxes.forEach(b=>s+=`<rect class="pl" x="${b.x-b.sx/2}" y="${b.z-b.sz/2}" width="${b.sx}" height="${b.sz}"/>`);
  uniqUnits(f).forEach(u=>{ u.rects.forEach(([x0,x1,z0,z1])=>s+=`<rect class="u ${u.status} ${state.unit===u?'sel':''}" data-u="${u.idx}" x="${x0}" y="${z0}" width="${x1-x0}" height="${z1-z0}"/>`);
    const r=u.rects[0], cx=(r[0]+r[1])/2+(r[0]<0?-1.5:1.5), cz=(r[2]+r[3])/2;
    s+=`<text x="${cx}" y="${cz-0.75}">${u.code}</text><text class="s" x="${cx}" y="${cz+0.85}">${u.beds} bd · ${u.area} m²</text>`; });
  const c=CONFIG; s+=`<rect class="core" x="${-c.coreW/2}" y="${-c.coreD/2}" width="${c.coreW}" height="${c.coreD}" rx=".3"/><text class="s" x="0" y="0">CORE</text>`;
  s+=`<text class="sea" x="0" y="${HD+pad+0.5}">▼  SEA · PASEO MARÍTIMO</text><text class="sea" x="0" y="${-HD-pad+0.9}" style="fill:#c9b9a3">▲  CITY · MONTES DE MÁLAGA</text></svg>`;
  return s;
}
function renderPanel(){
  const f=state.sel,P=$('#panel'); if(!f){ P.classList.remove('open'); return; }
  const t=f.tower,a=avail(f),u=state.unit,us=uniqUnits(f);
  P.innerHTML=`<div class="ph"><div class="t"><div class="eyebrow">Tower ${t.id}${f.num>=20?' · Penthouse':''}</div><h2>Floor ${f.num}</h2>
    <div class="meta">+${f.y.toFixed(1)} m · ${us.length} home${us.length>1?'s':''} · <b>${a} available</b></div></div>
    <button class="ib" data-act="down" title="Floor below">↓</button><button class="ib" data-act="up" title="Floor above">↑</button><button class="ib" data-act="close" title="Close (Esc)">✕</button></div>
  <div class="pb">${planSVG(f)}
    <div class="legend"><span><em class="st-available"></em>Available</span><span><em class="st-reserved"></em>Reserved</span><span><em class="st-sold"></em>Sold</span></div>
    <div class="units">${us.map(x=>`<button class="unit ${u===x?'sel':''}" data-u="${x.idx}"><span class="dot st-${x.status}"></span>
      <span class="n"><b>${x.code}</b><small>${x.beds} bed · ${x.area} m² · ${x.orient}</small></span>
      <span class="p">${x.status==='sold'?'—':money(x.price)}<small class="c-${x.status}">${STATUS[x.status]}</small></span></button>`).join('')}</div>
    ${u?`<div class="detail"><h3>${u.code}<span class="pill ${u.status}">${STATUS[u.status]}</span></h3>
      <div class="grid"><div>Bedrooms<b>${u.beds}</b></div><div>Bathrooms<b>${u.baths}</b></div><div>Built<b>${u.area} m²</b></div>
      <div>Terrace<b>${u.terrace} m²</b></div><div>Outlook<b style="font-size:12.5px">${u.orient}</b></div><div>Floor<b>${f.num}</b></div></div>
      <div class="price">${u.status==='sold'?'Sold':money(u.price)}${u.status!=='sold'?`<small>${CONFIG.currency}${Math.round(u.price/u.area).toLocaleString('en')}/m²</small>`:''}</div>
      <button class="cta" data-act="enquire" ${u.status==='sold'?'disabled':''}>${u.status==='sold'?'No longer available':u.status==='reserved'?'Join the waitlist':'Request details'}</button></div>`:''}
  </div>`;
  P.classList.add('open');
}
function renderAll(){ renderTabs(); renderFloors(); renderPanel(); drawOverlay(); }
function selectFloor(f,{fly=true}={}){
  state.sel=f; state.unit=null; state.tower=f.tower;
  if(!state.photo) placeBox(selBox,f); unitBoxes.forEach(b=>b.visible=false); hoverBox.visible=false;
  renderAll(); if(fly && !state.photo) flyToFloor(f);
}
function selectUnit(u){
  state.unit=state.unit===u?null:u; unitBoxes.forEach(b=>b.visible=false);
  if(state.unit && !state.photo) state.unit.rects.forEach((r,i)=>placeBox(unitBoxes[i],state.sel,r));
  renderPanel(); drawOverlay();
}
function deselect(){ state.sel=null; state.unit=null; selBox.visible=false; unitBoxes.forEach(b=>b.visible=false); renderAll(); }
function stepFloor(d){ const t=state.tower,i=state.sel?t.floors.indexOf(state.sel)+d:(d>0?0:t.floors.length-1); if(t.floors[i]) selectFloor(t.floors[i]); }
let toastT; function toast(m){ const el=$('#toast'); el.textContent=m; el.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),2600); }

$('#tabs').addEventListener('click',e=>{ const b=e.target.closest('.tab'); if(!b) return; state.tower=TOWERS.find(t=>t.id===b.dataset.t); renderTabs(); renderFloors(); if(!state.photo&&(!state.sel||state.sel.tower!==state.tower)) flyToTower(state.tower); });
$('#floors').addEventListener('click',e=>{ const b=e.target.closest('.fl'); if(b) selectFloor(state.tower.floors[+b.dataset.f-1]); });
$('#floors').addEventListener('mouseover',e=>{ const b=e.target.closest('.fl'); setHover(b?state.tower.floors[+b.dataset.f-1]:null,false); });
$('#floors').addEventListener('mouseleave',()=>setHover(null,false));
$('#panel').addEventListener('click',e=>{ const a=e.target.closest('[data-act]')?.dataset.act, u=e.target.closest('[data-u]');
  if(a==='close') deselect(); else if(a==='up') stepFloor(1); else if(a==='down') stepFloor(-1);
  else if(a==='enquire') toast('Demo — hook this up to the sales form / CRM'); else if(u) selectUnit(uniqUnits(state.sel)[+u.dataset.u]); });
$('#views').addEventListener('click',e=>{ const b=e.target.closest('.vw'); if(b) goView(b.dataset.v); });
$('#todBtn').addEventListener('click',()=>setTime(tod==='day'?'sunset':'day'));
document.querySelectorAll('[data-beds]').forEach(b=>b.addEventListener('click',()=>{ state.beds=b.dataset.beds; document.querySelectorAll('[data-beds]').forEach(x=>x.classList.toggle('on',x===b)); applyFilter(); }));
$('#availBtn').addEventListener('click',e=>{ state.avail=!state.avail; e.currentTarget.classList.toggle('on',state.avail); applyFilter(); });
function applyFilter(){ refreshColors(); renderFloors(); const n=ALL_FLOORS.filter(floorMatch).length; $('#matchInfo').textContent=filterOn()?`${n} floor${n===1?'':'s'} match`:''; }
addEventListener('keydown',e=>{
  if(e.key==='ArrowUp'){ e.preventDefault(); stepFloor(1); } else if(e.key==='ArrowDown'){ e.preventDefault(); stepFloor(-1); }
  else if(e.key==='Escape') deselect(); else if(e.key.length===1&&'12345'.includes(e.key)) goView(ORDER[+e.key-1]);
});

/* tower labels */
const labelEls=TOWERS.map(t=>{ const el=document.createElement('div'); el.className='tl'; el.dataset.t=t.id; el.innerHTML=`<b>${t.id}</b><i></i>`;
  el.addEventListener('click',()=>{ state.tower=t; renderTabs(); renderFloors(); if(!state.photo) flyToTower(t); }); $('#labels').appendChild(el); return el; });
function updateLabels(){
  TOWERS.forEach((t,i)=>{ _v.set(0,ROOF_Y+16,0).applyMatrix4(t.group.matrixWorld);
    const front=_v.clone().applyMatrix4(camera.matrixWorldInverse).z<-5; _v.project(camera);
    const el=labelEls[i], vis=front&&Math.abs(_v.x)<1.05&&Math.abs(_v.y)<1.05;
    el.style.opacity=vis?1:0; el.style.pointerEvents=vis?'auto':'none';
    el.style.transform=`translate(${(_v.x*.5+.5)*innerWidth}px,${(-_v.y*.5+.5)*innerHeight}px) translate(-50%,-100%)`; });
}

/* ---------------- picking ---------------- */
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
const blockers=[glassMesh,plateMesh,...towerSolids];
let needPick=false, mouse={x:0,y:0,in:false}, down=null;
function pick(){ ray.setFromCamera(ndc,camera); const h=ray.intersectObjects(blockers,false)[0]; if(!h) return null;
  if(h.object===glassMesh) return glassF[h.instanceId]; if(h.object===plateMesh) return plateF[h.instanceId]||null; if(h.object===finMesh) return finF[h.instanceId]||null; return null; }
const setNdc=e=>{ ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1); mouse.x=e.clientX; mouse.y=e.clientY; };
canvas.addEventListener('pointermove',e=>{ setNdc(e); mouse.in=e.pointerType==='mouse'; needPick=true;
  if(down && state.photo && Math.hypot(e.clientX-down.x,e.clientY-down.y)>6) exitPhoto(); });
canvas.addEventListener('pointerleave',()=>{ mouse.in=false; setHover(null); });
canvas.addEventListener('pointerdown',e=>{ down={x:e.clientX,y:e.clientY,t:performance.now()}; });
canvas.addEventListener('pointerup',e=>{ if(!down) return; const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y),dt=performance.now()-down.t; down=null;
  if(moved>6||dt>500||flight) return; setNdc(e); const f=pick(); if(f) selectFloor(f); });
const tip=$('#tip');
function setHover(f,fromCanvas=true){
  if(state.hover===f) return; state.hover=f;
  if(f&&f!==state.sel&&!state.photo) placeBox(hoverBox,f); else hoverBox.visible=false;
  canvas.style.cursor=f?'pointer':'';
  if(f&&fromCanvas){ tip.innerHTML=`<b>Tower ${f.tower.id} · Floor ${f.num}</b><small>${avail(f)} of ${uniqUnits(f).length} available · click to open</small>`; tip.style.opacity=1; } else tip.style.opacity=0;
  document.querySelectorAll('#floors .fl').forEach(el=>el.classList.toggle('hv',!!f&&f.tower===state.tower&&+el.dataset.f===f.num));
  drawOverlay();
}

/* ---------------- dev export for Higgsfield ---------------- */
const devlog=t=>$('#devlog').textContent=t;
function download(blob,name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); }
async function shootMode(on){
  document.body.classList.toggle('shoot',on);
  [hoverBox,selBox,...unitBoxes].forEach(b=>b.visible=false);
  if(on){ renderer.setPixelRatio(1); renderer.setSize(1920,1080,false); camera.clearViewOffset(); camera.aspect=ASPECT; camera.updateProjectionMatrix(); }
  else { renderer.setPixelRatio(Math.min(devicePixelRatio,1.75)); fitCamera(); if(state.sel) placeBox(selBox,state.sel); }
}
function applyClouds(k){ cloudGroup.visible=k>0.01; cloudMats.forEach((m,i)=>m.opacity=k*(i===0?1:i===1?.95:.9)); }
function setClouds(k){ cloudK=cloudTarget=k; applyClouds(k); }
async function exportStills(){
  exitPhoto(); flight=null; await shootMode(true);
  for(const v of ORDER){ devlog(`Rendering ${v}…`); setPose(VIEWS[v]); setClouds(VIEWS[v].clouds?1:0); camera.updateMatrixWorld();
    renderer.render(scene,camera); const blob=await new Promise(r=>canvas.toBlob(r,'image/png')); download(blob,`still-${v}-${tod}.png`);
    await new Promise(r=>setTimeout(r,350)); }
  await shootMode(false); setPose(VIEWS[state.view||'front']); devlog('Done: 5 stills saved to Downloads');
}
async function recordClips(){
  exitPhoto(); flight=null; await shootMode(true);
  const mime=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));
  for(let i=0;i<ORDER.length;i++){
    const a=ORDER[i], b=ORDER[(i+1)%ORDER.length], A=VIEWS[a], B=VIEWS[b];
    devlog(`Recording ${a} → ${b}…`); setPose(A); setClouds(A.clouds?1:0); renderer.render(scene,camera);
    const stream=canvas.captureStream(0), track=stream.getVideoTracks()[0], rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:16e6}), chunks=[];
    rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
    const f=makeFlight(A.pos,A.target,B.pos,B.target,5); rec.start(250);
    renderer.render(scene,camera); track.requestFrame(); await new Promise(r=>setTimeout(r,120));
    await new Promise(res=>{ const t0=performance.now(); const tick=()=>{ const k=Math.min(1,(performance.now()-t0)/5000);
      const {pos,tgt}=poseAt(f,k); camera.position.copy(pos); camera.lookAt(tgt);
      const ca=A.clouds?1:0, cb=B.clouds?1:0; applyClouds(ca+(cb-ca)*ease(k));
      renderer.render(scene,camera); track.requestFrame(); if(k<1) requestAnimationFrame(tick); else setTimeout(res,300); }; tick(); });
    rec.requestData(); rec.stop(); await new Promise(r=>rec.onstop=r); track.stop();
    download(new Blob(chunks,{type:'video/webm'}),`clip-${a}-${b}-${tod}.webm`);
  }
  await shootMode(false); controls.target.set(...VIEWS[state.view||'front'].target); devlog('Done: 5 clips saved to Downloads');
}
if(DEV){ $('#dev').classList.add('on');
  $('#dStills').onclick=exportStills; $('#dClips').onclick=recordClips;
  $('#dCam').onclick=()=>{ const s=JSON.stringify({pos:camera.position.toArray().map(n=>+n.toFixed(1)),target:controls.target.toArray().map(n=>+n.toFixed(1))}); navigator.clipboard?.writeText(s); devlog(s); };
}

/* ---------------- loop ---------------- */
addEventListener('resize',()=>{ fitCamera(); drawOverlay(); });
const clock=new THREE.Clock(); let time=0, first=true;
function frame(){
  requestAnimationFrame(frame); if(document.body.classList.contains('shoot')) return;
  const dt=Math.min(clock.getDelta(),0.05); time+=dt;
  waterNormal.offset.x+=dt*0.0035; waterNormal.offset.y+=dt*0.0022;
  stepFlight(dt); if(!flight){ controls.update(); if(camera.position.y<MIN_CAM_Y) camera.position.y=MIN_CAM_Y; }
  cloudK+=(cloudTarget-cloudK)*Math.min(1,dt*1.6); applyClouds(cloudK);
  selBox.userData.mat.opacity=0.26+Math.sin(time*3)*0.09;
  if(needPick&&mouse.in&&!flight){ needPick=false; setHover(pick()); }
  if(mouse.in&&state.hover) tip.style.transform=`translate(${mouse.x+16}px,${mouse.y+16}px)`;
  updateLabels();
  if(state.photo){ camera.updateMatrixWorld(); } else renderer.render(scene,camera);
  if(first){ first=false; $('#loader').classList.add('done'); setTimeout(()=>goView('front'),250); }
}
renderAll(); applyFilter();
frame();
window.__towers={state,TOWERS,goView,selectFloor,selectUnit,renderer,setTime,flying:()=>!!flight};
// ?dev only: headless capture of any camera pose at 1920×1080 (used to compare the views with the reference photos)
if(DEV) window.__cam=camera;
if(DEV) Object.assign(window.__towers,{ VIEWS,
  async shot(pose){ exitPhoto(); flight=null; await shootMode(true); setPose(pose); camera.updateMatrixWorld();
    renderer.render(scene,camera); const calls=renderer.info.render.calls, url=canvas.toDataURL('image/png'); await shootMode(false); return {url,calls}; } });
</script>
