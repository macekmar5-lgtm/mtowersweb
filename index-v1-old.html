<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Málaga Towers · Choose your floor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bronze:#d8b47a;--bronze-2:#b48d55;--txt:#f1f3f5;--mute:#a3acb6;--line:rgba(255,255,255,.10);
  --panel:rgba(13,17,23,.62);--av:#7fd8a6;--rs:#f2bd5c;--sd:#5f6873;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0c1015;color:var(--txt);font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.glass{background:var(--panel);backdrop-filter:blur(18px) saturate(1.25);-webkit-backdrop-filter:blur(18px) saturate(1.25);border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.28)}

/* brand */
.brand{position:fixed;top:22px;left:24px;z-index:5;pointer-events:none}
.brand .logo{font-family:Montserrat,sans-serif;font-weight:800;letter-spacing:.32em;font-size:15px;text-shadow:0 2px 14px rgba(0,0,0,.35)}
.brand .logo b{color:var(--bronze);text-shadow:0 1px 10px rgba(0,0,0,.55)}
.brand .tag{margin-top:6px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.75);text-shadow:0 1px 8px rgba(0,0,0,.4)}

/* filters */
#filters{position:fixed;top:18px;right:18px;z-index:5;display:flex;align-items:center;gap:6px;padding:6px}
#filters .lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);padding:0 8px 0 10px}
.chip{padding:8px 12px;border-radius:12px;font-size:13px;font-weight:500;color:var(--mute);transition:.2s}
.chip:hover{color:var(--txt);background:rgba(255,255,255,.06)}
.chip.on{background:var(--bronze);color:#1a140c}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
#matchInfo{font-size:12px;color:var(--bronze);padding:0 10px;white-space:nowrap;min-width:0}

/* elevator */
#elev{position:fixed;left:18px;top:50%;transform:translateY(-46%);z-index:5;width:132px;padding:10px;display:flex;flex-direction:column;max-height:calc(100vh - 210px)}
.tabs{display:flex;gap:4px;margin-bottom:8px}
.tab{flex:1;padding:8px 0;border-radius:10px;font-family:Montserrat,sans-serif;font-weight:700;font-size:13px;color:var(--mute);transition:.2s}
.tab:hover{color:var(--txt);background:rgba(255,255,255,.06)}
.tab.on{background:rgba(216,180,122,.16);color:var(--bronze)}
.tsum{font-size:11px;color:var(--mute);text-align:center;margin-bottom:8px}
.tsum b{color:var(--av);font-weight:600}
#floors{overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column;gap:2px}
#floors::-webkit-scrollbar{display:none}
.fl{display:flex;align-items:center;gap:8px;padding:3px 8px;border-radius:8px;transition:background .15s,opacity .2s;text-align:left}
.fl span{width:22px;font-size:11px;font-variant-numeric:tabular-nums;color:var(--mute)}
.fl i{display:flex;gap:3px}
.fl i em{width:12px;height:6px;border-radius:3px;display:block}
.fl:hover{background:rgba(255,255,255,.07)}
.fl.on{background:rgba(216,180,122,.22)}
.fl.on span{color:var(--bronze);font-weight:600}
.fl.dim{opacity:.28}
.fl.m span{color:var(--txt)}
.st-available{background:var(--av)}.st-reserved{background:var(--rs)}.st-sold{background:var(--sd)}
.tr{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#8fb07a;padding:5px 8px;opacity:.85}
.tr.cap{color:var(--bronze)}

/* panel */
#panel{position:fixed;right:18px;top:84px;bottom:96px;width:380px;z-index:6;display:flex;flex-direction:column;overflow:hidden;
  transform:translateX(calc(100% + 30px));transition:transform .45s cubic-bezier(.2,.8,.2,1)}
#panel.open{transform:none}
.ph{padding:18px 18px 12px;display:flex;align-items:flex-start;gap:10px;border-bottom:1px solid var(--line)}
.ph .t{flex:1}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--bronze)}
.ph h2{font-family:Montserrat,sans-serif;font-weight:700;font-size:28px;margin:4px 0 2px;letter-spacing:.01em}
.meta{font-size:12.5px;color:var(--mute)}
.meta b{color:var(--av);font-weight:600}
.ib{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--mute);border:1px solid var(--line);transition:.2s;font-size:15px}
.ib:hover{color:var(--txt);background:rgba(255,255,255,.07)}
.pb{overflow-y:auto;padding:14px 18px 18px;flex:1;scrollbar-width:thin}
.plan{width:100%;display:block;margin-bottom:10px}
.plan .u{stroke:rgba(255,255,255,.55);stroke-width:.12;cursor:pointer;transition:fill-opacity .2s}
.plan .u.available{fill:var(--av);fill-opacity:.28}
.plan .u.reserved{fill:var(--rs);fill-opacity:.26}
.plan .u.sold{fill:#8a939d;fill-opacity:.16}
.plan .u:hover{fill-opacity:.5}
.plan .u.sel{fill:var(--bronze);fill-opacity:.7;stroke:#fff;stroke-width:.2}
.plan .core{fill:rgba(255,255,255,.06);stroke:rgba(255,255,255,.25);stroke-width:.1}
.plan .bal{fill:none;stroke:rgba(255,255,255,.35);stroke-width:.1;stroke-dasharray:.4 .3}
.plan text{fill:#fff;font-size:1.25px;font-family:Inter,sans-serif;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
.plan text.s{fill:rgba(255,255,255,.6);font-size:.95px}
.plan text.sea{fill:#8fc8e6;font-size:1.05px;letter-spacing:.3px}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--mute);margin-bottom:12px}
.legend span{display:flex;align-items:center;gap:6px}
.legend em{width:10px;height:10px;border-radius:3px;display:block}
.units{display:flex;flex-direction:column;gap:6px}
.unit{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.025);text-align:left;transition:.2s}
.unit:hover{background:rgba(255,255,255,.06)}
.unit.sel{border-color:var(--bronze);background:rgba(216,180,122,.1)}
.unit .dot{width:8px;height:8px;border-radius:50%;flex:none}
.unit .n{flex:1;min-width:0}
.unit .n b{font-size:13.5px;font-weight:600}
.unit .n small{display:block;font-size:12px;color:var(--mute);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unit .p{font-size:13px;font-weight:600;text-align:right;white-space:nowrap}
.unit .p small{display:block;font-size:11px;font-weight:500;margin-top:2px}
.c-available{color:var(--av)}.c-reserved{color:var(--rs)}.c-sold{color:var(--mute)}
.detail{margin-top:12px;padding:16px;border-radius:14px;background:linear-gradient(160deg,rgba(216,180,122,.14),rgba(216,180,122,.03));border:1px solid rgba(216,180,122,.35)}
.detail h3{font-family:Montserrat,sans-serif;font-size:17px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.pill{font-family:Inter,sans-serif;font-size:11px;font-weight:600;padding:4px 9px;border-radius:20px;letter-spacing:.04em}
.pill.available{background:rgba(127,216,166,.16);color:var(--av)}
.pill.reserved{background:rgba(242,189,92,.16);color:var(--rs)}
.pill.sold{background:rgba(255,255,255,.08);color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.grid div{font-size:11px;color:var(--mute);letter-spacing:.04em}
.grid b{display:block;font-size:15px;color:var(--txt);font-weight:600;margin-top:2px}
.price{font-family:Montserrat,sans-serif;font-size:22px;font-weight:700;margin-bottom:12px}
.price small{font-family:Inter,sans-serif;font-size:12px;font-weight:500;color:var(--mute);margin-left:6px}
.cta{width:100%;padding:12px;border-radius:12px;background:var(--bronze);color:#1b140b;font-weight:600;font-size:14px;transition:.2s}
.cta:hover{background:#e6c48d}
.cta:disabled{background:rgba(255,255,255,.08);color:var(--mute);cursor:default}

/* views */
#views{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:5;display:flex;gap:4px;padding:6px}
.vw{padding:10px 16px;border-radius:13px;font-size:13.5px;font-weight:500;color:var(--mute);white-space:nowrap;transition:.2s}
.vw:hover{color:var(--txt);background:rgba(255,255,255,.06)}
.vw.on{background:#fff;color:#11161c}
#hint{position:fixed;left:24px;bottom:28px;z-index:4;font-size:12px;color:rgba(255,255,255,.75);text-shadow:0 1px 8px rgba(0,0,0,.5);pointer-events:none}

/* floating */
#tip{position:fixed;z-index:8;pointer-events:none;padding:8px 12px;border-radius:12px;font-size:12.5px;opacity:0;transition:opacity .15s;white-space:nowrap}
#tip b{font-weight:600}#tip small{display:block;color:var(--mute);margin-top:2px}
#labels{position:fixed;inset:0;pointer-events:none;z-index:3}
.tl{position:absolute;left:0;top:0;pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;transition:opacity .3s}
.tl b{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:Montserrat,sans-serif;font-weight:700;font-size:14px;background:rgba(13,17,23,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.35);transition:.2s}
.tl:hover b,.tl.on b{background:var(--bronze);color:#1b140b;border-color:var(--bronze)}
.tl i{width:1px;height:22px;background:linear-gradient(rgba(255,255,255,.6),rgba(255,255,255,0))}
#toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,20px);z-index:9;padding:12px 16px;border-radius:14px;font-size:13px;opacity:0;transition:.35s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
#loader{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#0c1015;transition:opacity .9s}
#loader div{font-family:Montserrat,sans-serif;font-weight:800;letter-spacing:.32em;font-size:14px;color:var(--bronze);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
#loader.done{opacity:0;pointer-events:none}

/* mobile */
@media (max-width:820px){
  .brand{top:14px;left:16px}.brand .logo{font-size:13px}
  #filters{top:auto;bottom:78px;right:10px;left:10px;justify-content:center;overflow-x:auto;scrollbar-width:none}
  #filters .lbl,#matchInfo{display:none}
  #elev{left:10px;width:100px;top:62px;transform:none;max-height:calc(100vh - 210px)}
  .fl i em{width:9px}
  #views{bottom:14px;left:10px;right:10px;transform:none;overflow-x:auto;scrollbar-width:none}
  .vw{padding:9px 12px;font-size:12.5px}
  #hint{display:none}
  #panel{top:auto;left:0;right:0;bottom:0;width:auto;height:62vh;border-radius:20px 20px 0 0;transform:translateY(105%)}
  #panel.open{transform:none}
  .plan{max-height:200px}
}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
}}
</script>

<body>
<canvas id="c" tabindex="0"></canvas>
<div id="labels"></div>

<header class="brand">
  <div class="logo">MÁLAGA <b>TOWERS</b></div>
  <div class="tag">Concept · sample data</div>
</header>

<div id="filters" class="glass">
  <span class="lbl">Bedrooms</span>
  <button class="chip on" data-beds="any">Any</button>
  <button class="chip" data-beds="1">1</button>
  <button class="chip" data-beds="2">2</button>
  <button class="chip" data-beds="3">3</button>
  <button class="chip" data-beds="4">4+</button>
  <span class="sep"></span>
  <button class="chip" id="availBtn">Available only</button>
  <span id="matchInfo"></span>
</div>

<aside id="elev" class="glass">
  <div class="tabs" id="tabs"></div>
  <div class="tsum" id="tsum"></div>
  <div id="floors"></div>
</aside>

<section id="panel" class="glass"></section>

<nav id="views" class="glass">
  <button class="vw" data-v="front">Front</button>
  <button class="vw" data-v="side">Side</button>
  <button class="vw" data-v="back">Back</button>
  <button class="vw" data-v="rooftop">Rooftop</button>
  <button class="vw" data-v="clouds">Above the clouds</button>
</nav>
<div id="hint">Click a floor · drag to orbit · ↑↓ to change floor</div>
<div id="tip" class="glass"></div>
<div id="toast" class="glass"></div>
<div id="loader"><div>MÁLAGA TOWERS</div></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Sky } from 'three/addons/objects/Sky.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* =========================================================
   CONFIG — swap in the real numbers from the developer here
   ========================================================= */
const CONFIG = {
  floorH: 3.6,          // m per residential floor
  podiumH: 8,           // lobby + podium height
  terraceH: 7.2,        // double-height sky garden between blocks
  coreHalf: 3,          // half width of the lift core (plan)
  currency: '€',
  seed: 20261115,       // change to reshuffle the sample availability
  // blocks = residential floors per stacked glass block (bottom → top)
  towers: [
    { id:'A', x:-56, z:4,  rot: 0.06, w:24, d:20, blocks:[7,6,5], offs:[[0,0],[1.6,-1.2],[-1.2,1.4]] },
    { id:'B', x:0,   z:-6, rot:-0.04, w:24, d:20, blocks:[7,7,6], offs:[[0,0],[-1.6,1.2],[1.2,-1.0]] },
    { id:'C', x:56,  z:2,  rot: 0.03, w:24, d:20, blocks:[8,7,7], offs:[[0,0],[1.4,1.2],[-1.4,-1.2]] },
  ],
};

const VIEWS = {
  front:   { pos:[-30, 30, 340],  target:[0, 52, 0] },
  side:    { pos:[360, 46, 120],  target:[0, 50, 0] },
  back:    { pos:[110, 150, -330],target:[0, 45, 10] },
  rooftop: { pos:[128, 138, -64], target:[-25, 92, 22] },
  clouds:  { pos:[-270, 150, 310],target:[0, 84, 0], clouds:true },
};

/* ---------------- sample data ---------------- */
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R = rng(CONFIG.seed);

function makeUnits(f){
  const hw=f.w/2, hd=f.d/2, c=CONFIG.coreHalf, zs=-2;
  const WF=[-hw,-c,zs,hd], WB=[-hw,-c,-hd,zs], EF=[c,hw,zs,hd], EB=[c,hw,-hd,zs], W=[-hw,-c,-hd,hd], E=[c,hw,-hd,hd];
  const top = f.isTop;
  const L = top ? [[W,E]] : f.ratio>0.8 ? [[W],[E]] : f.ratio>0.5 ? [[W],[EF],[EB]] : [[WF],[WB],[EF],[EB]];
  return L.map((rects,i)=>{
    const gross = rects.reduce((a,r)=>a+(r[1]-r[0])*(r[3]-r[2]),0);
    const area = Math.round(gross*0.9);
    const front = rects.some(r=>r[3]>=hd-0.01), back = rects.some(r=>r[2]<=-hd+0.01);
    const west = rects.some(r=>r[0]<0), east = rects.some(r=>r[1]>0);
    const orient = top ? 'Panoramic' : [front&&back?'Sea + city':front?'Sea view':'City view', west&&east?'':west?'West':'East'].filter(Boolean).join(' · ');
    const beds = top?4 : area<70?1 : area<105?2 : area<170?3 : 4;
    const baths = beds<=2 ? beds : beds-1+(area>150?1:0);
    const terrace = top ? 85 : Math.round(front ? 15+R()*6 : 7+R()*3);
    const ppm = 9800 + f.num*240 + (front?1600:0) + (top?4200:0);
    const price = Math.round(area*ppm/5000)*5000;
    const soldP = 0.34 + f.ratio*0.28, r = R();
    const status = r<soldP ? 'sold' : r<soldP+0.16 ? 'reserved' : 'available';
    return { idx:i, code:`${f.tower.id}-${f.num}.${i+1}`, rects, area, beds, baths, terrace, orient, price, status, floor:f };
  });
}

const TOWERS = CONFIG.towers.map(tc=>{
  const t = { ...tc, floors:[], terraces:[], group:new THREE.Group() };
  t.group.position.set(tc.x,0,tc.z); t.group.rotation.y = tc.rot; t.group.updateMatrixWorld(true);
  const total = tc.blocks.reduce((a,b)=>a+b,0);
  let y = CONFIG.podiumH, num = 1;
  tc.blocks.forEach((n,bi)=>{
    const [ox,oz] = tc.offs[bi];
    for(let i=0;i<n;i++){
      t.floors.push({ tower:t, num, block:bi, y, ox, oz, w:tc.w, d:tc.d, ratio:(num-1)/(total-1), isTop:num===total });
      num++; y += CONFIG.floorH;
    }
    if(bi<tc.blocks.length-1){
      t.terraces.push({ y, ox:(ox+tc.offs[bi+1][0])/2, oz:(oz+tc.offs[bi+1][1])/2, below:num-1 });
      y += CONFIG.terraceH;
    }
  });
  t.topY = y; t.topOff = tc.offs[tc.offs.length-1];
  t.floors.forEach(f=>f.units = makeUnits(f));
  return t;
});
const ALL_FLOORS = TOWERS.flatMap(t=>t.floors);

/* ---------------- renderer / scene ---------------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.62;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;           // static scene → bake shadows once

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 1, 12000);
camera.position.set(-460, 320, 760);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.07;
controls.minDistance = 25; controls.maxDistance = 1300;
controls.maxPolarAngle = Math.PI*0.495;
controls.target.set(0,60,0);
controls.rotateSpeed = 0.6; controls.zoomSpeed = 0.8;

/* sky + environment (generated once) */
const SUN_AZ = -98, SUN_EL = 4.5;
const sunDir = new THREE.Vector3().setFromSphericalCoords(1, THREE.MathUtils.degToRad(90-SUN_EL), THREE.MathUtils.degToRad(SUN_AZ));
const sky = new Sky(); sky.scale.setScalar(10000);
Object.assign(sky.material.uniforms.turbidity, {value:5.5});
sky.material.uniforms.rayleigh.value = 2.4;
sky.material.uniforms.mieCoefficient.value = 0.005;
sky.material.uniforms.mieDirectionalG.value = 0.86;
sky.material.uniforms.sunPosition.value.copy(sunDir);
const pmrem = new THREE.PMREMGenerator(renderer);
const envScene = new THREE.Scene(); envScene.add(sky);
scene.environment = pmrem.fromScene(envScene, 0.02).texture;
scene.add(sky);
const HAZE = new THREE.Color(0xd8c3ac);
scene.fog = new THREE.FogExp2(HAZE, 0.00042);

scene.add(new THREE.HemisphereLight(0xc9dbff, 0x9a7a5a, 0.55));
const sun = new THREE.DirectionalLight(0xffc28c, 2.6);
const lightDir = new THREE.Vector3().setFromSphericalCoords(1, THREE.MathUtils.degToRad(90-13), THREE.MathUtils.degToRad(SUN_AZ));
sun.position.copy(lightDir).multiplyScalar(600);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera, { left:-170, right:170, top:170, bottom:-170, near:50, far:1500 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.6;
scene.add(sun, sun.target);

/* ---------------- textures (procedural, no downloads) ---------------- */
function canvasTex(w,h,draw,srgb=true){
  const c=document.createElement('canvas'); c.width=w; c.height=h; draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c); if(srgb) t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=4; return t;
}
const mullionTex = canvasTex(256,64,(g,w,h)=>{
  g.fillStyle='#fff'; g.fillRect(0,0,w,h);
  g.fillStyle='#8a7a66'; for(let i=0;i<8;i++) g.fillRect(i*32,0,1.5,h);
  g.fillRect(0,0,w,2);
});
const bandTex = canvasTex(64,4,(g,w,h)=>{
  for(let x=0;x<w;x++){ const k=0.86+0.14*Math.sin(x/w*Math.PI*2); const v=Math.round(255*k); g.fillStyle=`rgb(${v},${v},${v})`; g.fillRect(x,0,1,h); }
});
bandTex.wrapS = bandTex.wrapT = THREE.RepeatWrapping; bandTex.repeat.set(0.4,0.12);

const waterNormal = canvasTex(256,256,(g,N)=>{
  const img=g.createImageData(N,N), wr=rng(3), W=[];

function tmat(t,x,y,z,sx,sy,sz,ry=0){
  const m=new THREE.Matrix4().compose(_p.set(x,y,z), _q.setFromEuler(_e.set(0,ry,0)), _s.set(sx,sy,sz));

function instanced(geo, mat, mats, {cast=true, receive=true, colors=null}={}){

/* ---------------- camera flights ---------------- */
let flight=null;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function flyTo(pos,target,{clouds=false,dur}={}){
  const sp=camera.position.clone(), st=controls.target.clone(), et=new THREE.Vector3(...target), ep=new THREE.Vector3(...pos);
  const so=new THREE.Spherical().setFromVector3(sp.clone().sub(st)), eo=new THREE.Spherical().setFromVector3(ep.clone().sub(et));
  let dT=eo.theta-so.theta; dT=((dT+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;  // shortest way round
  const duration = dur ?? THREE.MathUtils.clamp(1.2+Math.abs(dT)*0.55+Math.abs(Math.log(eo.radius/so.radius))*0.55+st.distanceTo(et)/260, 1.2, 3.4);
  flight={t:0,duration,st,et,so,eo,dT}; controls.enabled=false; cloudTarget = clouds?1:0;
}
function stepFlight(dt){
  if(!flight) return;
  const f=flight; f.t=Math.min(1,f.t+dt/f.duration); const k=ease(f.t);
  const tgt=f.st.clone().lerp(f.et,k);
  const r=Math.exp(THREE.MathUtils.lerp(Math.log(f.so.radius),Math.log(f.eo.radius),k));
  const phi=Math.max(0.05, THREE.MathUtils.lerp(f.so.phi,f.eo.phi,k) - Math.sin(Math.PI*k)*0.1);
  const theta=f.so.theta+f.dT*k;
  camera.position.setFromSpherical(new THREE.Spherical(r,phi,theta)).add(tgt);
  camera.lookAt(tgt);
  if(f.t>=1){ controls.target.copy(f.et); controls.enabled=true; flight=null; }
}
function goView(name){
  const v=VIEWS[name]; state.view=name; flyTo(v.pos,v.target,{clouds:!!v.clouds});
  document.querySelectorAll('.vw').forEach(b=>b.classList.toggle('on',b.dataset.v===name));
}
function floorWorld(f){ return new THREE.Vector3(f.ox,f.y+FH/2,f.oz).applyMatrix4(f.tower.group.matrixWorld); }
function flyToFloor(f){
  const w=floorWorld(f), behind=camera.position.z<-40;
  const dir=new THREE.Vector3(f.tower.id==='A'?-0.55:f.tower.id==='C'?0.55:0.08,0,behind?-1:1).normalize();
  const p=w.clone().addScaledVector(dir,125); p.y=w.y+18;
  state.view=null; document.querySelectorAll('.vw').forEach(b=>b.classList.remove('on'));
  flyTo(p.toArray(), w.toArray());
}
function flyToTower(t){

}

  <div class="pb">
    ${planSVG(f)}
    <div class="legend"><span><em class="st-available"></em>Available</span><span><em class="st-reserved"></em>Reserved</span><span><em class="st-sold"></em>Sold</span></div>
    <div class="units">${f.units.map(x=>`
      <button class="unit ${u===x?'sel':''}" data-u="${x.idx}">
        <span class="dot st-${x.status}"></span>
        <span class="n"><b>${x.code}</b><small>${x.beds} bed · ${x.area} m² · ${x.orient}</small></span>
        <span class="p">${x.status==='sold'?'—':money(x.price)}<small class="c-${x.status}">${STATUS[x.status]}</small></span>
      </button>`).join('')}</div>
    ${u?`<div class="detail">
      <h3>${u.code}<span class="pill ${u.status}">${STATUS[u.status]}</span></h3>
      <div class="grid">
        <div>Bedrooms<b>${u.beds}</b></div><div>Bathrooms<b>${u.baths}</b></div><div>Interior<b>${u.area} m²</b></div>
        <div>Terrace<b>${u.terrace} m²</b></div><div>Outlook<b style="font-size:13px">${u.orient}</b></div><div>Floor<b>${f.num}</b></div>
      </div>
      <div class="price">${u.status==='sold'?'Sold':money(u.price)}${u.status!=='sold'?`<small>${CONFIG.currency}${Math.round(u.price/u.area).toLocaleString('en')}/m²</small>`:''}</div>
      <button class="cta" data-act="enquire" ${u.status==='sold'?'disabled':''}>${u.status==='sold'?'No longer available':u.status==='reserved'?'Join the waitlist':'Request details'}</button>
    </div>`:''}
  </div>`;
  P.classList.add('open');
}
function renderAll(){ renderTabs(); renderFloors(); renderPanel(); }

function selectFloor(f,{fly=true}={}){
  state.sel=f; state.unit=null; state.tower=f.tower;
  placeBox(selBox,f); unitBoxes.forEach(b=>b.visible=false);
  renderAll(); if(fly) flyToFloor(f);
}
function selectUnit(u){
  state.unit = state.unit===u ? null : u;
  unitBoxes.forEach(b=>b.visible=false);
  if(state.unit) state.unit.rects.forEach((r,i)=>placeBox(unitBoxes[i],state.unit.floor,r));
  renderPanel();
}
function deselect(){ state.sel=null; state.unit=null; selBox.visible=false; unitBoxes.forEach(b=>b.visible=false); renderAll(); }
function stepFloor(d){
  const t=state.tower, i=state.sel ? t.floors.indexOf(state.sel)+d : (d>0?0:t.floors.length-1);
  if(t.floors[i]) selectFloor(t.floors[i]);
}
let toastT; function toast(msg){ const el=$('#toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),2600); }

$('#tabs').addEventListener('click',e=>{ const b=e.target.closest('.tab'); if(!b) return; state.tower=TOWERS.find(t=>t.id===b.dataset.t); renderTabs(); renderFloors(); if(!state.sel || state.sel.tower!==state.tower) flyToTower(state.tower); });
$('#floors').addEventListener('click',e=>{ const b=e.target.closest('.fl'); if(b) selectFloor(state.tower.floors[+b.dataset.f-1]); });
$('#panel').addEventListener('click',e=>{
  const a=e.target.closest('[data-act]')?.dataset.act, u=e.target.closest('[data-u]');
  if(a==='close') deselect(); else if(a==='up') stepFloor(1); else if(a==='down') stepFloor(-1);
  else if(a==='enquire') toast('Demo — hook this button up to the sales form / CRM');
  else if(u) selectUnit(state.sel.units[+u.dataset.u]);
});
$('#views').addEventListener('click',e=>{ const b=e.target.closest('.vw'); if(b) goView(b.dataset.v); });
document.querySelectorAll('[data-beds]').forEach(b=>b.addEventListener('click',()=>{
  state.beds=b.dataset.beds; document.querySelectorAll('[data-beds]').forEach(x=>x.classList.toggle('on',x===b)); applyFilter();
}));
$('#availBtn').addEventListener('click',e=>{ state.avail=!state.avail; e.currentTarget.classList.toggle('on',state.avail); applyFilter(); });
function applyFilter(){
  refreshColors(); renderFloors();
  const n=ALL_FLOORS.filter(floorMatch).length;
  $('#matchInfo').textContent = filterOn() ? `${n} floor${n===1?'':'s'} match` : '';
}
addEventListener('keydown',e=>{
  if(e.key==='ArrowUp'){ e.preventDefault(); stepFloor(1); }
  else if(e.key==='ArrowDown'){ e.preventDefault(); stepFloor(-1); }
  else if(e.key==='Escape') deselect();
  else if('12345'.includes(e.key) && e.key.length===1) goView(Object.keys(VIEWS)[+e.key-1]);
});

/* tower labels */
const labelEls = TOWERS.map(t=>{
  const el=document.createElement('div'); el.className='tl'; el.dataset.t=t.id; el.innerHTML=`<b>${t.id}</b><i></i>`;
  el.addEventListener('click',()=>{ state.tower=t; renderTabs(); renderFloors(); flyToTower(t); });
  $('#labels').appendChild(el); return el;
});
const _v=new THREE.Vector3();
function updateLabels(){
  TOWERS.forEach((t,i)=>{
    _v.set(t.topOff[0], t.topY+FH*2+10, t.topOff[1]).applyMatrix4(t.group.matrixWorld);
    const front=_v.clone().applyMatrix4(camera.matrixWorldInverse).z<-5; _v.project(camera);
    const el=labelEls[i], vis=front && Math.abs(_v.x)<1.05 && Math.abs(_v.y)<1.05;
    el.style.opacity=vis?1:0;
    el.style.transform=`translate(${(_v.x*.5+.5)*innerWidth}px,${(-_v.y*.5+.5)*innerHeight}px) translate(-50%,-100%)`;
  });
}

/* ---------------- picking ---------------- */
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
const blockers=[glassMesh, slabMesh, coreMesh, podium, ...crownMeshes];
let needPick=false, mouse={x:0,y:0,in:false}, down=null;
function pick(){
  ray.setFromCamera(ndc,camera);
  const h=ray.intersectObjects(blockers,false)[0]; if(!h) return null;
  if(h.object===glassMesh) return instFloor[h.instanceId];
  if(h.object===slabMesh) return slabFloor[h.instanceId]||null;
  return null;
}
function setNdc(e){ ndc.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1); mouse.x=e.clientX; mouse.y=e.clientY; }
canvas.addEventListener('pointermove',e=>{ setNdc(e); mouse.in=e.pointerType==='mouse'; needPick=true; });
canvas.addEventListener('pointerleave',()=>{ mouse.in=false; setHover(null); });
canvas.addEventListener('pointerdown',e=>{ down={x:e.clientX,y:e.clientY,t:performance.now()}; });
canvas.addEventListener('pointerup',e=>{
  if(!down) return; const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y), dtm=performance.now()-down.t; down=null;
  if(moved>6 || dtm>500 || flight) return;
  setNdc(e); const f=pick(); if(f) selectFloor(f);
});
const tip=$('#tip');
function setHover(f){
  if(state.hover===f) return; state.hover=f;
  if(f && f!==state.sel){ placeBox(hoverBox,f); } else hoverBox.visible=false;
  canvas.style.cursor=f?'pointer':'';
  if(f){ const a=avail(f); tip.innerHTML=`<b>Tower ${f.tower.id} · Floor ${f.num}</b><small>${a} of ${f.units.length} available · click to open</small>`; tip.style.opacity=1; }
  else tip.style.opacity=0;
}

/* ---------------- loop ---------------- */
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
const clock=new THREE.Clock(); let time=0, first=true;
renderer.shadowMap.needsUpdate=true;
function frame(){
  requestAnimationFrame(frame);
  const dt=Math.min(clock.getDelta(),0.05); time+=dt;
  waterNormal.offset.x+=dt*0.0035; waterNormal.offset.y+=dt*0.0022;
  stepFlight(dt); if(!flight) controls.update();
  // clouds fade
  cloudK += (cloudTarget-cloudK)*Math.min(1,dt*1.6);
  cloudGroup.visible = cloudK>0.01;
  if(cloudGroup.visible){ cloudMats.forEach((m,i)=>m.opacity=cloudK*(i===0?1:i===1?0.9:0.85)); deckTex.offset.x+=dt*0.0015; }
  scene.fog.density = 0.00042 + cloudK*0.0003;
  // highlight pulse
  selBox.userData.mat.opacity = 0.32+Math.sin(time*3)*0.1;
  if(needPick && mouse.in && !flight){ needPick=false; setHover(pick()); }
  if(mouse.in && state.hover){ tip.style.transform=`translate(${mouse.x+16}px,${mouse.y+16}px)`; }
  updateLabels();
  renderer.render(scene,camera);
  if(first){ first=false; $('#loader').classList.add('done'); setTimeout(()=>goView('front'),250); }
}
renderAll(); applyFilter(); cloudTarget=1; cloudK=1;
frame();
window.__towers={state,TOWERS,goView,selectFloor,selectUnit,renderer,flying:()=>!!flight};
</script>
</body>
</html>
